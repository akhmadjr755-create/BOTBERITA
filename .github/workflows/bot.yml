# Nama Workflow
name: Jalankan Bot Berita

# Pemicu (Trigger)
on:
  schedule:
    # Konversi WIB (UTC+7) ke UTC untuk GitHub Actions:
    # 04:00 WIB = 21:00 UTC (H-1)
    # 06:00 WIB = 23:00 UTC (H-1)
    # 12:00 WIB = 05:00 UTC
    # 16:00 WIB = 09:00 UTC
    # 19:00 WIB = 12:00 UTC
    - cron: '0 21,23,5,9,12 * * *'
  workflow_dispatch: # Memungkinkan run manual dari tombol GitHub

# Pekerjaan (Jobs)
jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      # Langkah 1: Ambil kode dari repositori
      - name: Checkout kode
        uses: actions/checkout@v4

      # Langkah 2: Siapkan environment Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Langkah 3: Install dependensi
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Langkah 4: Eksekusi Bot
      - name: Jalankan Bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: python bot.py
